<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#grad1)" opacity="0.1"/>
  <circle cx="128" cy="128" r="110" fill="url(#grad1)" opacity="0.2"/>
  <circle cx="128" cy="128" r="100" fill="url(#grad1)"/>
  
  <!-- Brain/AI neural network icon -->
  <g transform="translate(128, 128)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="8" fill="white"/>
    
    <!-- Neural connections -->
    <line x1="0" y1="0" x2="-40" y2="-30" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="40" y2="-30" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="-40" y2="30" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="40" y2="30" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-45" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="45" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="-50" y2="0" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="50" y2="0" stroke="white" stroke-width="2" opacity="0.6"/>
    
    <!-- Outer nodes -->
    <circle cx="-40" cy="-30" r="6" fill="white" opacity="0.9"/>
    <circle cx="40" cy="-30" r="6" fill="white" opacity="0.9"/>
    <circle cx="-40" cy="30" r="6" fill="white" opacity="0.9"/>
    <circle cx="40" cy="30" r="6" fill="white" opacity="0.9"/>
    <circle cx="0" cy="-45" r="6" fill="white" opacity="0.9"/>
    <circle cx="0" cy="45" r="6" fill="white" opacity="0.9"/>
    <circle cx="-50" cy="0" r="6" fill="white" opacity="0.9"/>
    <circle cx="50" cy="0" r="6" fill="white" opacity="0.9"/>
    
    <!-- Small dots for decoration -->
    <circle cx="-20" cy="-15" r="2" fill="white" opacity="0.5"/>
    <circle cx="20" cy="-15" r="2" fill="white" opacity="0.5"/>
    <circle cx="-20" cy="15" r="2" fill="white" opacity="0.5"/>
    <circle cx="20" cy="15" r="2" fill="white" opacity="0.5"/>
  </g>
  
  <!-- Text at bottom -->
  <text x="128" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Local GPT</text>
</svg>