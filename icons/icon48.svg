<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="url(#grad1)"/>
  
  <!-- Neural network -->
  <g transform="translate(24, 24)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="3" fill="white"/>
    
    <!-- Connections -->
    <line x1="0" y1="0" x2="-10" y2="-10" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="10" y2="-10" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="-10" y2="10" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="10" y2="10" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="0" y2="12" stroke="white" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Outer nodes -->
    <circle cx="-10" cy="-10" r="2" fill="white"/>
    <circle cx="10" cy="-10" r="2" fill="white"/>
    <circle cx="-10" cy="10" r="2" fill="white"/>
    <circle cx="10" cy="10" r="2" fill="white"/>
    <circle cx="0" cy="-12" r="2" fill="white"/>
    <circle cx="0" cy="12" r="2" fill="white"/>
  </g>
</svg>